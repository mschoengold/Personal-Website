[build]
  command = "npm run build"
  publish = "out"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), camera=(), microphone=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://gc.zgo.at; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://*.goatcounter.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# NOTE ON /private: real path-level password protection (Netlify's built-in
# password protection or Basic-Auth via headers below) requires a Netlify Pro
# plan and cannot be scoped to a single path on the Free/Personal tier. The
# client-side password check in app/private/page.tsx is NOT real security —
# the password ships inside the public JS bundle and is visible to anyone via
# view-source. Until this site is on a plan that supports it, treat that page
# as public. If you upgrade, scope real protection to just this path with:
# [[headers]]
#   for = "/private/*"
#   [headers.values]
#     Basic-Auth = "USERNAME:PASSWORD"

# Redirect www to non-www (fixed: was pointing at the wrong domain)
[[redirects]]
  from = "https://www.mschoengoldbeatty.com/*"
  to = "https://mschoengoldbeatty.com/:splat"
  status = 301
  force = true
